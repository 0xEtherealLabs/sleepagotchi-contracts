[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
# Load-bearing, not a lint: every accrual path multiplies a balance by elapsed
# seconds, and a silent wrap there is a wrong payout rather than a crash.
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
