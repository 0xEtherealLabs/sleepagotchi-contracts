[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

# The app builds transactions from the committed IDL, so it has to be a tracked
# file rather than a build artifact under the gitignored `target/`.
# `anchor new` rewrites this file and drops comments — check it after running one.
[hooks]
post_build = "cp target/idl/*.json target/types/*.ts idl/"
